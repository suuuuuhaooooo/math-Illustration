<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278"><rect width="760" height="278" fill="#fff"/><rect x="10.0" y="20.0" width="300.0" height="66.0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="160.0" y="43.0" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">若甯有2顆糖，曜璇有5顆糖，兩人共</text><text x="160.0" y="63.0" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">有幾顆？</text><circle cx="320.0" cy="53.0" r="4.0" fill="#000" stroke="#000" stroke-width="1"/><rect x="450.0" y="20.0" width="300.0" height="66.0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="600.0" y="53.0" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">5－2</text><circle cx="440.0" cy="53.0" r="4.0" fill="#000" stroke="#000" stroke-width="1"/><rect x="10.0" y="106.0" width="300.0" height="66.0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="160.0" y="129.0" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">若甯有5元，曜璇比若甯少2元，</text><text x="160.0" y="149.0" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">曜璇有幾元？</text><circle cx="320.0" cy="139.0" r="4.0" fill="#000" stroke="#000" stroke-width="1"/><rect x="450.0" y="106.0" width="300.0" height="66.0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="600.0" y="139.0" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">2×5</text><circle cx="440.0" cy="139.0" r="4.0" fill="#000" stroke="#000" stroke-width="1"/><rect x="10.0" y="192.0" width="300.0" height="66.0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="160.0" y="225.0" font-family="sans-serif" font-size="16" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">每盒有2個，5盒共有幾個？</text><circle cx="320.0" cy="225.0" r="4.0" fill="#000" stroke="#000" stroke-width="1"/><rect x="450.0" y="192.0" width="300.0" height="66.0" fill="#fff" stroke="#000" stroke-width="1.8"/><text x="600.0" y="225.0" font-family="sans-serif" font-size="18" fill="#000" text-anchor="middle" dominant-baseline="central" font-weight="normal">2＋5</text><circle cx="440.0" cy="225.0" r="4.0" fill="#000" stroke="#000" stroke-width="1"/><line x1="320.0" y1="53.0" x2="440.0" y2="225.0" stroke="#333" stroke-width="2.2"/><line x1="320.0" y1="139.0" x2="440.0" y2="53.0" stroke="#333" stroke-width="2.2"/><line x1="320.0" y1="225.0" x2="440.0" y2="139.0" stroke="#333" stroke-width="2.2"/></svg>