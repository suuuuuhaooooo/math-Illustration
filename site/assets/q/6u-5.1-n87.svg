<svg xmlns="http://www.w3.org/2000/svg" width="420" height="246" viewBox="0 0 420 246">
<rect x="0" y="0" width="420" height="246" fill="#ffffff"/>
<rect x="6" y="6" width="408" height="230" fill="#ffffff" stroke="#555555" stroke-width="2"/>
<text x="210.0" y="39.0" font-family="sans-serif" font-size="20" text-anchor="middle" font-weight="bold" fill="#000000">集點活動</text>
<line x1="18" y1="54" x2="402" y2="54" stroke="#777777" stroke-dasharray="6 4"/>
<text x="22.0" y="75.0" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#000000">購物滿 40 元，獲得 1 點；</text>
<text x="22.0" y="105.0" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#000000">購物滿 80 元，獲得 2 點；……以此類推。</text>
<text x="22.0" y="135.0" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#000000">• 4 點可以換 1 枝原子筆</text>
<text x="22.0" y="165.0" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#000000">• 6 點可以換 1 本筆記本</text>
<text x="22.0" y="195.0" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#000000">• 12 點可以換 1 個筆袋</text>
<text x="22.0" y="225.0" font-family="sans-serif" font-size="17" text-anchor="start" font-weight="normal" fill="#000000">• 25 點可以換 1 盒水彩</text>
</svg>
