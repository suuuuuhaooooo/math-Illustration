<svg xmlns="http://www.w3.org/2000/svg" width="440" height="198" viewBox="0 0 440 198">
<rect x="0" y="0" width="440" height="198" fill="#ffffff"/>
<text x="14.0" y="34.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">小安：</text>
<rect x="92" y="12" width="330" height="42" rx="12" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
<text x="104.0" y="40.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">你的生日是幾月幾日？</text>
<text x="14.0" y="88.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">阿凱：</text>
<rect x="92" y="66" width="330" height="42" rx="12" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
<text x="104.0" y="94.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">月分和日期不一樣喔！</text>
<text x="14.0" y="142.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">阿凱：</text>
<rect x="92" y="120" width="330" height="66" rx="12" fill="#eeeeee" stroke="#000000" stroke-width="1"/>
<text x="104.0" y="148.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">日期是 35 和 40 的最大公因數，月分</text>
<text x="104.0" y="172.0" font-family="sans-serif" font-size="16" text-anchor="start" font-weight="normal" fill="#000000">是日期的倍數。</text>
</svg>
